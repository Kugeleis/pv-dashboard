name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate secrets.json from GitHub Repository Secrets
        # NOTE: The PVOutput API key is intentionally NOT written into
        # secrets.json. GitHub Pages is static hosting, so every file in the
        # artifact is world-readable. The API key lives as a secret inside
        # the Cloudflare Worker proxy instead (see README "Cloudflare Worker").
        env:
          PVOUTPUT_SYSTEM_ID: ${{ secrets.PVOUTPUT_SYSTEM_ID }}
          PVOUTPUT_PROXY_URL: ${{ secrets.PVOUTPUT_PROXY_URL }}
        run: |
          python3 - <<'PY'
          import os, json
          data = {
              "systemId": os.environ.get("PVOUTPUT_SYSTEM_ID", "").strip(),
              "proxyUrl": os.environ.get("PVOUTPUT_PROXY_URL", "").strip(),
          }
          with open("secrets.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
          print("Generated secrets.json (systemId + proxyUrl only).")
          PY

      - name: Verify secrets.json exists
        run: |
          test -f secrets.json || { echo "ERROR: secrets.json was not generated"; exit 1; }
          echo "secrets.json content (no API key, by design):"
          cat secrets.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the root directory containing index.html, styles.css, app.js
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
